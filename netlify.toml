# Netlify configuration for Next.js (OpenNext adapter)
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/

[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  # NEWSLETTER_PROVIDER holds a provider name (e.g. "convertkit"), not a credential.
  # It's legitimately used in server output, so exclude it from secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEWSLETTER_PROVIDER"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "pg", "pg-native"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-DNS-Prefetch-Control = "on"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/blog/"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/learn/"
  to = "/learn"
  status = 301

[[redirects]]
  from = "/faq/"
  to = "/faq"
  status = 301

# Enable skew protection (requires Netlify Pro+)
# [build.environment]
#   NETLIFY_NEXT_SKEW_PROTECTION = "true"